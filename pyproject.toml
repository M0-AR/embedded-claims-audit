[project]
name = "embedded-claims-audit"
version = "1.0.0"
description = "A reproducible audit of quantitative claims in motor-drive and embedded-systems education"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Embedded Claims Audit Project"}]
keywords = [
  "reproducibility",
  "engineering-education",
  "motor-drives",
  "pmsm",
  "svpwm",
  "embedded-systems",
  "pcb-design",
  "artifact-evaluation",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Education",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<4",
  "matplotlib>=3.8,<4",
  "PyYAML>=6,<7",
  "Jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.5,<1", "build>=1.2,<2"]

[project.urls]
Homepage = "https://m0-ar.github.io/embedded-claims-audit/"
Repository = "https://github.com/M0-AR/embedded-claims-audit"
Issues = "https://github.com/M0-AR/embedded-claims-audit/issues"
Changelog = "https://github.com/M0-AR/embedded-claims-audit/blob/main/CHANGELOG.md"
Releases = "https://github.com/M0-AR/embedded-claims-audit/releases"
Container = "https://github.com/M0-AR/embedded-claims-audit/blob/main/Dockerfile"

[project.scripts]
eca-run = "eca.run:main"
eca-paper = "eca.paper:main"
eca-verify = "eca.verify:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
