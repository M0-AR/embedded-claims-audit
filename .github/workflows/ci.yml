name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit tests
        run: pytest
      - name: Experiments and verification
        env:
          MPLBACKEND: Agg
          PYTHONPATH: src
        run: |
          python -m eca.run
          if [ -f data/raw/measures_v2.csv ]; then python -m eca.paper; fi
          python -m eca.verify
      - name: Web data bundle
        env:
          PYTHONPATH: src
        run: python scripts/build_web_data.py
      - name: Artifact summary
        run: |
          sha256sum results/results.json README.md demo/data.js
