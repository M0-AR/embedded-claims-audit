name: Bug report
description: Report a broken command, page, or console behavior.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a wrong number or verdict, use the claim
        challenge template instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact commands, URLs, browser, and viewport.
      placeholder: |
        1. python3 -m http.server 8000
        2. Open http://localhost:8000/preview.html
        3. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, branch, or commit SHA.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste errors or console output. Remove credentials and local paths.
      render: shell
    validations:
      required: false
